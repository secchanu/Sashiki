[package]
name = "sashiki"
version = "0.1.0"
edition = "2024"
description = "Sashiki - Terminals for each worktree. All in one place."
license = "MIT"

[features]
default = ["lang-rust", "lang-typescript", "lang-javascript", "lang-python", "lang-json", "lang-bash", "lang-toml", "lang-css", "lang-html"]
lang-rust = ["dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-json = ["dep:tree-sitter-json"]
lang-bash = ["dep:tree-sitter-bash"]
lang-toml = ["dep:tree-sitter-toml-ng"]
lang-css = ["dep:tree-sitter-css"]
lang-html = ["dep:tree-sitter-html"]

[dependencies]
# GPU-accelerated UI Framework (from Zed git - includes IME fixes)
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }

# Terminal emulation
alacritty_terminal = "0.25.1"

# Glob pattern matching (for session template file copy)
glob = "0.3"

# Async runtime
smol = "2.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# URL detection and opening
regex = "1"
open = "5"

# Syntax highlighting
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"

# Language grammars (optional, controlled by feature flags)
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-bash = { version = "0.23", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-html = { version = "0.23", optional = true }

# LSP client
lsp-types = "0.97"
async-process = "2"
async-channel = "2"
async-lock = "3"
url = "2"
content_inspector = "0.2"
which = "6"

# Serialization (for LSP JSON-RPC)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
